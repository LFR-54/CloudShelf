* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { font: 13px/1.4 var(--font); color: var(--text); background: var(--wallpaper); background-attachment: fixed; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
button, input, select { font: inherit; color: inherit; }
input[type="checkbox"] { accent-color: var(--accent); width: 15px; height: 15px; margin: 0; }
@keyframes spin { to { transform: rotate(360deg); } }
.spin { display: inline-block; animation: spin 1s linear infinite; }
.stage { min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
.menubar { align-self: stretch; height: 30px; display: flex; align-items: center; gap: 2px; padding: 0 10px; background: var(--menubar); backdrop-filter: blur(24px) saturate(1.6); position: relative; z-index: 5; }
.menubar .apps { display: flex; align-items: center; gap: 2px; flex: 1; min-width: 0; overflow: hidden; }
.menubar .item { height: 24px; padding: 0 9px; border-radius: 6px; border: 0; background: none; cursor: default; display: flex; align-items: center; gap: 5px; white-space: nowrap; flex-shrink: 0; }
.menubar .item.bold { font-weight: 600; }
.menubar .item.active { background: rgba(127, 127, 127, .3); }
.menubar .item i { font-size: 16px; }
.menubar .glyph { width: 17px; height: 17px; display: block; }
.menubar .speed { font-variant-numeric: tabular-nums; font-size: 11px; }
@media (max-width: 760px) { .menubar .apps .item:nth-child(n+3), .menubar .sys { display: none; } }
.scaler { padding: 28px 16px 0; transform-origin: top center; }
.window { width: 1120px; height: 760px; border-radius: 26px; background: var(--window); backdrop-filter: blur(40px) saturate(1.4); box-shadow: var(--shadow); display: flex; position: relative; overflow: hidden; }
.appearance { margin: 18px 0 40px; display: flex; align-items: center; gap: 10px; }
.appearance > span { font-size: 12px; color: var(--text-2); }

.sidebar { width: 250px; margin: 8px; border-radius: 18px; background: var(--sidebar); border: .5px solid var(--card-border); display: flex; flex-direction: column; flex-shrink: 0; padding: 0 10px; }
.lights { display: flex; gap: 8px; padding: 16px 6px 20px; }
.lights span { width: 12px; height: 12px; border-radius: 50%; }
.lights span:nth-child(1) { background: #ff5f57; }
.lights span:nth-child(2) { background: #febc2e; }
.lights span:nth-child(3) { background: #28c840; }
.brand { display: flex; align-items: center; gap: 12px; padding: 0 4px 22px; }

.brand .app-icon { width: 58px; height: 58px; }
.brand b { display: block; font-size: 21px; font-weight: 700; letter-spacing: -.01em; }
.brand small { font-size: 12.5px; color: var(--text-2); }
.nav { display: flex; align-items: center; gap: 10px; width: 100%; height: 36px; padding: 0 10px; border: 0; background: none; border-radius: 9px; text-align: left; cursor: default; font-size: 14px; margin-bottom: 2px; }
.nav:hover { background: var(--hover); }
.nav.sel { background: var(--accent-nav); }
.nav i { font-size: 19px; width: 22px; text-align: center; color: var(--text-2); }
.nav.sel i { color: var(--accent); }
.nav .name { flex: 1; }
.count { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: rgba(120, 120, 128, .55); color: #fff; font-size: 11px; font-weight: 600; display: grid; place-items: center; }
.side-foot { margin-top: auto; padding: 12px 2px 14px 6px; display: flex; align-items: center; gap: 6px; }
.side-foot .ver { flex: 1; min-width: 0; line-height: 1.35; }
.side-foot .ver b { display: block; font-size: 15px; font-weight: 600; }
.side-foot .ver span { font-size: 12.5px; color: var(--text-2); }
.foot-btn { position: relative; width: 32px; height: 32px; border-radius: 50%; border: .5px solid var(--control-border); background: var(--control); display: grid; place-items: center; cursor: default; color: var(--text-2); flex-shrink: 0; }

const ioCell = (ic, label, v) => `<div><div class="k"><i class="ti ${ic}"></i>${label}</div><div class="v${v > 0 ? "" : " idle"}">${v > 0 ? fmtSpeed(v) : "Inactif"}</div></div>`;
const ioRows = d => ioCell("ti-arrow-down", "Lecture", d.read) + ioCell("ti-arrow-up", "Écriture", d.write);
const fill = d => d.used / d.total;
const spaceLevel = d => fill(d) >= 0.9 ? "full" : fill(d) >= 0.75 ? "warn" : "ok";
const spaceBar = d => `<div class="bar space-${spaceLevel(d)}"><span style="width:${fill(d) * 100}%"></span></div>`;
const plural = (n, word) => `${n} ${word}${n > 1 ? "s" : ""}`;
const isDetailOf = d => typeof page === "object" && page.drive === d.id;
const select = (id, options, value) => `<label class="popup"><select id="${id}">${options.map(o => `<option${o === value ? " selected" : ""}>${esc(o)}</option>`).join("")}</select><i class="ti ti-selector"></i></label>`;
const sw = (key, on, label) => `<button class="switch ${on ? "on" : ""}" data-key="${key}" aria-label="${esc(label)}" aria-pressed="${on}"></button>`;

function toast(message, kind = "ok") {
  const el = $("toast");
  el.classList.toggle("warn", kind !== "ok");
  el.querySelector("i").className = `ti ${kind === "ok" ? "ti-circle-check" : "ti-alert-triangle"}`;
  el.querySelector("span").textContent = message;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2800);
}

function nameError(value, exceptId) {
  const name = value.trim();
  if (!name) return "Saisissez un nom.";
  if (name.includes("/") || name.includes(":")) return "Le nom ne peut pas contenir « / » ni « : ».";
  if (drives.some(x => x.id !== exceptId && x.name.toLowerCase() === name.toLowerCase())) return "Un lecteur porte déjà ce nom.";
  return "";
}

function freeName(base) {
  if (!nameError(base)) return base;
  let n = 2;
  while (nameError(`${base} ${n}`)) n++;
  return `${base} ${n}`;
}

function renameDrive(d, value) {
  const error = nameError(value, d.id);
  if (error) return error;
  const name = value.trim();
  if (name !== d.name) {
    const old = d.name;
    d.name = name;
    toast(d.mounted ? `« ${old} » renommé en « ${name} ». Volume remonté.` : `« ${old} » renommé en « ${name} ».`);
  }
  return "";
}

function toggleMount(d) {
  d.mounted = !d.mounted;
  if (!d.mounted) { d.read = 0; d.write = 0; }
  toast(d.mounted ? `« ${d.name} » monté sur ${pathOf(d)}` : `« ${d.name} » démonté`);
}

function go(next) {
  page = next;
  menu = null;
  renaming = null;
  hoverIndex = null;
  render();
}

function runAction(d, act) {
  switch (act) {
    case "mount": toggleMount(d); render(); break;
    case "finder": toast(`Ouverture de ${pathOf(d)} dans le Finder`); break;
    case "copy":
      try { navigator.clipboard.writeText(pathOf(d)).catch(() => {}); } catch (e) {}
      toast(`Chemin copié : ${pathOf(d)}`);
      break;
    case "web": toast(`Ouverture de ${providers[d.p].web || "l'interface web"} dans le navigateur`); break;
    case "refresh":
      d.lastRefresh = 0;
      toast(`Contenu de « ${d.name} » actualisé`);
      if (isDetailOf(d)) renderPage();
      break;
    case "rename":
      if (isDetailOf(d)) { $("dName").focus(); $("dName").select(); }
      else { renaming = d.id; renderDrives(); }
      break;
    case "edit": openOverlay({ type: "add", provider: d.p, edit: d.id, signedIn: true, account: d.account }); break;
    case "reconnect": toast(`Autorisation renouvelée pour ${d.account}`); break;
    case "duplicate": duplicate(d); break;
    case "test":
      if (!isDetailOf(d)) go({ drive: d.id });
      startSpeedTest(d);
      $("speedRow").scrollIntoView({ block: "center", behavior: "smooth" });
      break;
    case "cache":
      openOverlay({
        type: "alert", title: `Vider le cache de « ${d.name} » ?`,
        message: `${num(d.cache, d.cache % 1 ? 1 : 0)} Go seront libérés sur ce Mac. Les fichiers seront retéléchargés à la prochaine lecture.`,
        confirm: "Vider", run: () => { const freed = d.cache; d.cache = 0; render(); toast(`${num(freed, freed % 1 ? 1 : 0)} Go libérés`); }
      });
      break;
    case "log": openOverlay({ type: "log", drive: d.id, level: "Tout" }); break;
    case "delete":
      openOverlay({
        type: "alert", title: `Supprimer « ${d.name} » ?`,
        message: "Le volume est démonté et sa configuration supprimée. Les fichiers dans le cloud ne sont pas touchés.",
        confirm: "Supprimer", destructive: true,
        run: () => {
          drives.splice(drives.indexOf(d), 1);
          delete history[d.id];
          if (isDetailOf(d)) page = "drives";
          render();
          toast(`« ${d.name} » supprimé`);
        }
      });
      break;
  }
}

function duplicate(d) {
  const copy = { ...d, id: nextId++, name: freeName(`${d.name} copie`), mounted: false, read: 0, write: 0, cache: 0, lastRefresh: null };
  drives.splice(drives.indexOf(d) + 1, 0, copy);
  history[copy.id] = Array(SAMPLES).fill(0);
  query = "";
  page = "drives";
  renaming = copy.id;
  render();
}

function openMenu(d, x, y) {
  menu = { id: d.id, x, y };
  renderMenu();
}

function toWindow(clientX, clientY) {
  const r = $("win").getBoundingClientRect(), k = r.width / 1120;
  return { x: (clientX - r.left) / k, y: (clientY - r.top) / k };
}

function renderMenu() {
  const layer = $("menuLayer");
  if (menu && !byId(menu.id)) menu = null;
  if (!menu) { layer.innerHTML = ""; return; }
  const d = byId(menu.id);
  const item = (act, ic, label, kbd = "", cls = "") => `<button data-act="${act}" class="${cls}"><i class="ti ${ic}"></i><span>${label}</span><span class="kbd">${kbd}</span></button>`;
  layer.innerHTML = `<div class="menu" id="menu" role="menu">
    ${item("mount", "ti-player-eject", d.mounted ? "Démonter" : "Monter", "⌘E")}
    ${item("finder", "ti-folder", "Afficher dans le Finder", "⌘O")}
    ${item("copy", "ti-copy", "Copier le chemin", "⌥⌘C")}
    ${item("refresh", "ti-refresh", "Actualiser le contenu", "⌘R")}
    ${providers[d.p].web ? item("web", "ti-external-link", "Ouvrir sur le web") : ""}
    <hr>
    ${item("rename", "ti-cursor-text", "Renommer", "↩")}
    ${item("edit", "ti-pencil", "Modifier la connexion…", "⌘I")}
    ${item("duplicate", "ti-copy-plus", "Dupliquer", "⌘D")}
    <hr>
    ${item("test", "ti-gauge", "Tester le débit")}
    ${item("cache", "ti-eraser", "Vider le cache…")}
    ${item("log", "ti-file-text", "Afficher le journal", "⌘L")}
    <hr>
    ${item("delete", "ti-trash", "Supprimer…", "⌘⌫", "danger")}
  </div>`;
  const el = $("menu");
  const h = el.offsetHeight;
  el.style.left = `${Math.min(menu.x, 1120 - 258)}px`;
  el.style.top = `${menu.y + h > 752 ? Math.max(8, menu.y - h) : menu.y}px`;
  el.querySelectorAll("[data-act]").forEach(b => b.onclick = e => {
    e.stopPropagation();
    menu = null;
    renderMenu();
    runAction(d, b.dataset.act);
  });
}

function renderNav() {
  const items = [
    ["drives", "ti-server", "Lecteurs montés", `<span class="count">${drives.filter(d => d.mounted).length}</span>`],
    ["activity", "ti-activity", "Activité", ""],
    ["add", "ti-circle-plus", "Ajouter un lecteur", ""],
    ["settings", "ti-settings", "Paramètres", ""]
  ];
  const current = typeof page === "object" ? "drives" : page;
  $("nav").innerHTML = items.map(([id, ic, label, extra]) =>
    `<button class="nav ${id === current ? "sel" : ""}" data-go="${id}"><i class="ti ${ic}"></i><span class="name">${label}</span>${extra}</button>`).join("");
  $("nav").querySelectorAll("[data-go]").forEach(b => b.onclick = () => b.dataset.go === "add" ? openOverlay({ type: "add", provider: "webdav" }) : go(b.dataset.go));
}

function renderHeader() {
  const actions = $("headerActions");
  if (page === "drives") {
    $("titles").innerHTML = `<div><h1>Lecteurs montés</h1><p id="hSub"></p></div>`;
    actions.innerHTML = `
      <button class="tbtn" id="hAdd"><i class="ti ti-circle-plus"></i>Ajouter</button>
      <button class="tbtn" id="hSettings"><i class="ti ti-settings"></i>Paramètres</button>
      <label class="tsearch"><i class="ti ti-search"></i><input id="hSearch" placeholder="Rechercher…" value="${esc(query)}"></label>`;
    $("hAdd").onclick = () => openOverlay({ type: "add", provider: "webdav" });
    $("hSettings").onclick = () => go("settings");
    $("hSearch").oninput = e => { query = e.target.value; renderDrives(); };
  } else if (page === "activity") {
    $("titles").innerHTML = `<div><h1>Activité</h1><p id="hSub"></p></div>`;
    actions.innerHTML = `<button class="tbtn" id="hUnmountAll"><i class="ti ti-player-eject"></i>Tout démonter</button>`;
    $("hUnmountAll").onclick = () => { drives.forEach(d => { d.mounted = false; d.read = 0; d.write = 0; }); render(); toast("Tous les lecteurs sont démontés"); };
  } else if (page === "settings") {
    $("titles").innerHTML = `<div><h1>Paramètres</h1><p>Valeurs par défaut des nouveaux lecteurs et comportement de l'app.</p></div>`;
    actions.innerHTML = "";
  } else {
    const d = byId(page.drive), pv = providers[d.p];
    $("titles").innerHTML = `<button class="back" id="hBack" aria-label="Retour aux lecteurs"><i class="ti ti-chevron-left"></i></button>
      <div><h1>${esc(d.name)}</h1><p>${pv.name} • <span class="mono">${esc(pathOf(d))}</span></p></div>`;
    actions.innerHTML = `<button class="tbtn" id="hFinder"><i class="ti ti-folder"></i>Afficher dans le Finder</button>
      <button class="tbtn" id="hMount"><i class="ti ti-player-eject"></i>${d.mounted ? "Démonter" : "Monter"}</button>
      <button class="icon-btn boxed" id="hMenu" aria-label="Autres actions"><i class="ti ti-dots-vertical"></i></button>`;
    $("hBack").onclick = () => go("drives");
    $("hFinder").onclick = () => runAction(d, "finder");
    $("hMount").onclick = () => runAction(d, "mount");
    $("hMenu").onclick = e => {
      e.stopPropagation();
      const r = $("hMenu").getBoundingClientRect(), p = toWindow(r.right, r.bottom);
      openMenu(d, p.x - 250, p.y + 4);
    };
  }
  updateSubtitle();
}

function updateSubtitle() {
  const el = $("hSub");
  if (!el) return;
  const mounted = drives.filter(d => d.mounted).length;
  const speed = sum("read") + sum("write");
  el.textContent = page === "drives"
    ? `${mounted} montés sur ${drives.length} · ${speed > 0 ? fmtSpeed(speed) : "aucun transfert"}`
    : "Débit et transferts des 60 dernières secondes";
}

function renderDrives() {
  const list = drives.filter(d => d.name.toLowerCase().includes(query.trim().toLowerCase()));
  if (!drives.length) {
    $("page").innerHTML = `<div class="empty"><p>Ajoutez un premier lecteur pour le retrouver dans le Finder.</p><button class="btn lg primary" id="emptyAdd">Ajouter un lecteur</button></div>`;
    $("emptyAdd").onclick = () => openOverlay({ type: "add", provider: "webdav" });
    return;
  }
  if (!list.length) {
    $("page").innerHTML = `<div class="empty"></div>`;
    $("page").firstChild.textContent = `Aucun lecteur ne correspond à « ${query} ».`;
    return;
  }
  $("page").innerHTML = list.map(d => {
    const [cls, label] = status(d), pv = providers[d.p];
    const title = renaming === d.id
      ? `<input class="rename" id="renameInput" value="${esc(d.name)}" aria-label="Nouveau nom de ${esc(d.name)}">`
      : `<b data-rename title="Double-cliquez pour renommer">${esc(d.name)}</b>`;
    return `<div class="dcard" data-id="${d.id}">
      ${tile(d.p)}
      <div>
        <div class="dcard-title"><span class="badge">${methodBadge(d)}</span>${title}<span class="state ${cls}"><span class="dot ${cls}"></span>${label}</span></div>
        ${renaming === d.id ? `<div class="field-error" id="renameError" hidden></div>` : ""}
        <div class="dcard-sub">${pv.name} • ${esc(d.account)}</div>
        ${spaceBar(d)}
        <div class="dcard-space">${fmtTo(d.total - d.used)} libres sur ${fmtTo(d.total)}${spaceLevel(d) === "full" ? ` · <span class="full-label">Presque plein</span>` : ""}</div>
      </div>
      ${d.mounted ? `<div class="io" data-io="${d.id}">${ioRows(d)}</div>` : `<button class="btn" data-mount>Monter</button>`}
      <button class="icon-btn" data-open aria-label="Détails de ${esc(d.name)}"><i class="ti ti-chevron-right"></i></button>
      <button class="icon-btn boxed" data-menu aria-label="Actions pour ${esc(d.name)}"><i class="ti ti-dots-vertical"></i></button>
    </div>`;
  }).join("");
  $("page").querySelectorAll(".dcard").forEach(card => {
    const d = byId(+card.dataset.id);
    card.onclick = e => {
      if (e.target.closest("#renameInput, [data-rename]")) return;
      if (e.target.closest("[data-mount]")) { runAction(d, "mount"); return; }
      if (e.target.closest("[data-menu]")) {
        e.stopPropagation();
        const r = e.target.closest("[data-menu]").getBoundingClientRect(), p = toWindow(r.right, r.bottom);
        if (menu && menu.id === d.id) { menu = null; renderMenu(); } else openMenu(d, p.x - 250, p.y + 4);
        return;
      }
      go({ drive: d.id });
    };
    card.oncontextmenu = e => {
      e.preventDefault();
      e.stopPropagation();
      const p = toWindow(e.clientX, e.clientY);
      openMenu(d, p.x, p.y);
    };
    const nameEl = card.querySelector("[data-rename]");
    if (nameEl) nameEl.ondblclick = () => { renaming = d.id; renderDrives(); };
  });
  bindRenameInput();
}

function bindRenameInput() {
  const input = $("renameInput");
  if (!input) return;
  const d = byId(renaming);
  const errorEl = $("renameError");
  input.focus();
  input.select();
  input.oninput = () => { errorEl.hidden = true; };
  input.onkeydown = e => {
    if (e.key === "Enter") {
      const error = renameDrive(d, input.value);
      if (error) { errorEl.textContent = error; errorEl.hidden = false; return; }
      renaming = null;
      render();
    } else if (e.key === "Escape") {
      renaming = null;
      renderDrives();
    }
  };
  input.onblur = () => {
    if (renaming !== d.id) return;
    renaming = null;
    renameDrive(d, input.value);
    render();
  };
}

function sparkline(values) {
  const max = Math.max(250, ...values);
  const pts = values.map((v, i) => `${(i / (values.length - 1) * 100).toFixed(1)},${(23 - v / max * 21).toFixed(1)}`).join(" ");
  return `<svg viewBox="0 0 100 24" preserveAspectRatio="none" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg>`;
}

function speedRow(d) {
  const t = speedTests[d.id];
  const hint = !t ? "Lit 1 Go d'un fichier existant pour mesurer le débit réel."
    : t.result ? `${fmtSpeed(t.result.read)} en lecture · latence ${t.result.latency} ms`
    : `<span class="spin"><i class="ti ti-loader-2"></i></span> Test en cours… ${Math.round(t.progress)} %<div class="bar"><span style="width:${t.progress}%"></span></div>`;
  const label = !t ? "Lancer le test" : t.result ? "Relancer" : "Annuler";
  return `<div>Tester le débit<div class="hint">${hint}</div></div><button class="btn" id="speedBtn">${label}</button>`;
}

function updateSpeedRow(d) {
  const row = $("speedRow");
  if (!row || !isDetailOf(d)) return;
  row.innerHTML = speedRow(d);
  $("speedBtn").onclick = () => {
    const t = speedTests[d.id];
    if (t && !t.result) { delete speedTests[d.id]; updateSpeedRow(d); } else startSpeedTest(d);
  };
}

function startSpeedTest(d) {
  const t = speedTests[d.id] = { progress: 0, result: null };
  const step = () => {
    if (speedTests[d.id] !== t) return;
    t.progress = Math.min(100, t.progress + 8 + Math.random() * 8);
    if (t.progress >= 100) {
      const base = testSpeed[d.p] || 80;
      t.result = { read: base * (0.92 + Math.random() * 0.16), latency: (testLatency[d.p] || 30) + Math.round(Math.random() * 8) };
    } else setTimeout(step, 220);
    updateSpeedRow(d);
  };
  updateSpeedRow(d);
  setTimeout(step, 220);
}

function renderDrive(d) {
  const pv = providers[d.p];
  const refreshed = d.lastRefresh === null ? "jamais" : d.lastRefresh === 0 ? "à l'instant" : `il y a ${d.lastRefresh} min`;
  $("page").innerHTML = `
    <div class="stats">
      <div class="stat"><div class="label">Lecture</div><div class="value" id="liveRead">${fmtSpeed(d.read)}</div><div id="spark">${sparkline(history[d.id])}</div></div>
      <div class="stat"><div class="label">Écriture</div><div class="value">${fmtSpeed(d.write)}</div><div class="sub">${d.write > 0 ? "2 fichiers en cours" : "Aucun envoi en attente"}</div></div>
      <div class="stat"><div class="label">Cache</div><div class="value">${num(d.cache, d.cache % 1 ? 1 : 0)} Go</div><div class="bar"><span style="width:${d.cacheMax ? d.cache / d.cacheMax * 100 : 0}%"></span></div><div class="sub">sur ${d.cacheMax} Go</div></div>
      <div class="stat"><div class="label">Espace libre</div><div class="value">${fmtTo(d.total - d.used)}</div>${spaceBar(d)}<div class="sub">sur ${fmtTo(d.total)}${spaceLevel(d) === "full" ? ` · <span class="full-label">Presque plein</span>` : ""}</div></div>

        <div><input class="field" id="dName" value="${esc(d.name)}" aria-label="Nom du volume"><div class="field-error" id="dNameError" hidden></div></div></div>
      <div class="row"><div>Emplacement<div class="hint">Dossier où le lecteur apparaît.</div></div>${select("dLocation", [pathOf(d), `~/Cloud/${d.name}`, "Autre dossier…"], pathOf(d))}</div>
      <div class="row"><div>Icône dans le Finder<div class="hint">Logo du service ou image personnalisée.</div></div><div class="row-actions">${tile(d.p)}<button class="btn" id="dIcon">Changer…</button></div></div>
    </div>

    <div class="section-title">Connexion</div>
    <div class="group">
      <div class="row"><div>${esc(d.account)}<div class="hint">${pv.name} · ${pv.kind === "oauth" ? "autorisé via le navigateur" : "identifiants dans le Trousseau"}</div></div>
        <div class="row-actions"><button class="btn" data-tool="edit">Modifier la connexion…</button>${pv.kind === "oauth" ? `<button class="btn" data-tool="reconnect">Reconnecter</button>` : ""}</div></div>
    </div>

    <div class="section-title">Performance</div>
    <div class="group">
      <div class="row"><div>Profil<div class="hint">${profiles[d.profile]}</div></div>
        <div class="segmented" id="profiles">${Object.keys(profiles).map(p => `<button class="${p === d.profile ? "on" : ""}">${p}</button>`).join("")}</div></div>
      <div class="row"><div>Taille maximale du cache</div>${select("dCacheMax", ["5 Go", "20 Go", "50 Go", "200 Go", "500 Go"], `${d.cacheMax} Go`)}</div>
      <div class="row"><div>Limite de débit<div class="hint">Téléchargement et envoi. « Heures creuses » applique un horaire.</div></div>
        <div class="row-actions">${select("dLimitDown", limits.map(l => `↓ ${l}`), `↓ ${d.limitDown}`)}${select("dLimitUp", limits.map(l => `↑ ${l}`), `↑ ${d.limitUp}`)}</div></div>
      <div class="row"><div>Options rclone<div class="hint mono">--vfs-read-chunk-streams 8 --buffer-size 64M</div></div><button class="btn">Modifier…</button></div>
    </div>

    <div class="section-title">Montage</div>
    <div class="group">
      <div class="row"><div>Méthode<div class="hint" id="methodHint">${methods[d.method]}</div></div>${select("dMethod", Object.keys(methods), d.method)}</div>
      <div class="row"><div>Monter à l'ouverture de session</div>${sw("login", d.login, "Monter à l'ouverture de session")}</div>
      <div class="row"><div>Reconnecter automatiquement<div class="hint">Remonte le lecteur après une coupure réseau ou une mise en veille.</div></div>${sw("autoReconnect", d.autoReconnect, "Reconnecter automatiquement")}</div>
      <div class="row"><div>Lecture seule</div>${sw("readOnly", d.readOnly, "Lecture seule")}</div>
      <div class="row"><div>Bloquer les fichiers macOS<div class="hint">Les .DS_Store et fichiers ._ ne sont pas envoyés dans le cloud.</div></div>${sw("hideMacFiles", d.hideMacFiles, "Bloquer les fichiers macOS")}</div>
    </div>

    <div class="section-title">Outils</div>
    <div class="group">
      <div class="row" id="speedRow">${speedRow(d)}</div>
      <div class="row"><div>Actualiser le contenu<div class="hint">Relit la liste des fichiers sur le serveur. Dernière actualisation : ${refreshed}.</div></div><button class="btn" data-tool="refresh">Actualiser</button></div>
      <div class="row"><div>Cache local<div class="hint">${num(d.cache, d.cache % 1 ? 1 : 0)} Go sur ce Mac.</div></div><button class="btn" data-tool="cache">Vider…</button></div>
      <div class="row"><div>Journal<div class="hint">Sortie de rclone pour ce lecteur.</div></div><button class="btn" data-tool="log">Afficher</button></div>
    </div>
    <div class="footer-actions"><button class="btn" data-tool="duplicate">Dupliquer</button><button class="btn destructive" data-tool="delete">Supprimer le lecteur…</button></div>`;

  const nameInput = $("dName"), nameErr = $("dNameError");
  const commitName = () => {
    const error = renameDrive(d, nameInput.value);
    nameErr.textContent = error;
    nameErr.hidden = !error;
    if (!error) { renderHeader(); renderNav(); renderPopover(); }
  };
  nameInput.oninput = () => { nameErr.hidden = true; };
  nameInput.onkeydown = e => {
    if (e.key === "Enter") { commitName(); nameInput.blur(); }
    if (e.key === "Escape") { nameInput.value = d.name; nameErr.hidden = true; nameInput.blur(); }

  });
  $("page").querySelectorAll("[data-tool]").forEach(b => b.onclick = () => runAction(d, b.dataset.tool));

}

function drawChart() {
  const svg = $("chart");
  if (!svg) return;
  const w = svg.clientWidth, h = svg.clientHeight, { left, right, top, bottom } = PLOT;
  const values = Array.from({ length: SAMPLES }, (_, i) => totalRead(i));
  const max = Math.max(300, Math.ceil(Math.max(...values) / 100) * 100);
  const x = i => left + i / (SAMPLES - 1) * (w - left - right);
  const y = v => top + (1 - v / max) * (h - top - bottom);
  const line = values.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  let out = [0, max / 2, max].map(t => `<line x1="${left}" x2="${w - right}" y1="${y(t)}" y2="${y(t)}" stroke="var(--grid)" stroke-width="1"/>
    <text x="${left - 6}" y="${y(t) + 3}" text-anchor="end">${Math.round(t)} Mo/s</text>`).join("");
  out += `<text x="${left}" y="${h - 4}">-60 s</text><text x="${(left + w - right) / 2}" y="${h - 4}" text-anchor="middle">-30 s</text><text x="${w - right}" y="${h - 4}" text-anchor="end">maintenant</text>`;
  out += `<polygon points="${x(0)},${y(0)} ${line} ${x(SAMPLES - 1)},${y(0)}" fill="var(--accent-soft)"/>`;
  out += `<polyline points="${line}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  if (hoverIndex !== null) {
    const hx = x(hoverIndex);
    out += `<line x1="${hx}" x2="${hx}" y1="${top}" y2="${h - bottom}" stroke="var(--text-3)" stroke-width="1"/>
      <circle cx="${hx}" cy="${y(values[hoverIndex])}" r="4.5" fill="var(--accent)" stroke="var(--window)" stroke-width="2"/>`;
  }
  svg.innerHTML = out;
  renderTooltip(hoverIndex === null ? null : { left: x(hoverIndex), w });
}

function renderTooltip(pos) {
  const tip = $("tooltip");
  if (!pos) { tip.style.display = "none"; return; }
  tip.replaceChildren();
  const ago = SAMPLES - 1 - hoverIndex;
  const when = document.createElement("div");
  when.className = "when";
  when.textContent = ago === 0 ? "Maintenant" : `Il y a ${ago} s`;
  tip.append(when);
  const addLine = (value, label, strong) => {
    const row = document.createElement("div");
    row.className = "line" + (strong ? " total" : "");
    const key = document.createElement("span");
    key.className = "key";
    if (!strong) key.style.opacity = "0";
    const b = document.createElement("b");
    b.textContent = fmtSpeed(value);
    const name = document.createElement("span");
    name.textContent = label;
    row.append(key, b, name);
    tip.append(row);
  };
  addLine(totalRead(hoverIndex), "Total", true);
  drives.filter(d => history[d.id][hoverIndex] > 0).forEach(d => addLine(history[d.id][hoverIndex], d.name, false));
  tip.style.display = "block";
  const tw = tip.offsetWidth;
  tip.style.left = `${Math.max(8, pos.left + 24 + tw > pos.w ? pos.left - tw : pos.left + 24)}px`;
  tip.style.top = "18px";
}

function bindChart() {
  const svg = $("chart");
  const indexAt = clientX => {
    const r = svg.getBoundingClientRect(), k = r.width / svg.clientWidth, left = PLOT.left * k, right = PLOT.right * k;
    return Math.max(0, Math.min(SAMPLES - 1, Math.round((clientX - r.left - left) / (r.width - left - right) * (SAMPLES - 1))));
  };
  svg.onpointermove = e => { hoverIndex = indexAt(e.clientX); drawChart(); };
  svg.onpointerleave = () => { hoverIndex = null; drawChart(); };
  svg.onfocus = () => { if (hoverIndex === null) { hoverIndex = SAMPLES - 1; drawChart(); } };
  svg.onblur = () => { hoverIndex = null; drawChart(); };
  svg.onkeydown = e => {
    if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
    e.preventDefault();
    hoverIndex = Math.max(0, Math.min(SAMPLES - 1, (hoverIndex ?? SAMPLES - 1) + (e.key === "ArrowLeft" ? -1 : 1)));
    drawChart();
  };
}

function renderNotesList() {
  const o = overlay, q = o.query.trim().toLowerCase();
  const shown = releases.map(r => {
    const versionHit = q && r.version.toLowerCase().includes(q);
    const sections = Object.keys(categories)
      .filter(c => o.cat === "all" || o.cat === c)
      .map(c => [c, (r.notes[c] || []).filter(n => !q || versionHit || n.t.toLowerCase().includes(q))])
      .filter(([, items]) => items.length);
    return { r, sections };
  }).filter(v => v.sections.length);
  const list = $("notesList");
  if (!shown.length) {
    list.innerHTML = `<div class="notes-empty"></div>`;
    list.firstChild.textContent = q ? `Aucune note ne correspond à « ${o.query.trim()} ».` : "Aucune note dans cette catégorie.";
    return;
  }
  const years = [...new Set(shown.map(v => v.r.year))];
  list.innerHTML = years.map(year => {
    const items = shown.filter(v => v.r.year === year), folded = o.folded.includes(year);
    return `<div class="rel-year">
      <button class="rel-year-side ${folded ? "collapsed" : ""}" data-year="${year}" aria-expanded="${!folded}"><span class="y">${year}<i class="ti ti-chevron-down"></i></span><small>${plural(items.length, "version")}</small></button>

          <div class="rel-head"><h4>${esc(r.version)}</h4><span class="rel-date">${r.date}</span>${r.latest ? `<span class="rbadge latest">Dernière</span>` : ""}${r.security ? `<span class="rbadge security">Sécurité</span>` : ""}<span class="rel-engine">${r.engine}</span></div>
          ${sections.map(([c, notes]) => `<div class="rel-cat ${c}">${categories[c]}</div>
          <ul>${notes.map(n => `<li class="${n.b ? "b" : ""}">${n.sec ? `<span class="rbadge security">Sécurité</span>` : ""}${esc(n.t)}</li>`).join("")}</ul>`).join("")}
        </article>`).join("")}</div>
    </div>`;
  }).join("");
  list.querySelectorAll("[data-year]").forEach(b => b.onclick = () => {
    const year = +b.dataset.year;
    o.folded = o.folded.includes(year) ? o.folded.filter(y => y !== year) : [...o.folded, year];
    renderNotesList();
  });
}

function logLines(d) {
  const remote = `${d.p}-${d.name.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, "")}:`;
  const mountType = d.method === "macFUSE" ? "cmount" : "nfsmount";
  const lines = [
    ["23:02:41", "INFO", `${remote} Mounting on "${pathOf(d)}" using ${mountType}`],
    ["23:02:41", "INFO", `${remote} vfs cache: root is "~/Library/Caches/CloudShelf/vfs/${remote.slice(0, -1)}"`],
    ["23:02:42", "INFO", `${remote} poll-interval is 1m0s`]
  ];
  if (d.p === "dropbox") lines.push(
    ["23:05:10", "INFO", "Films/Dune (2021)/Dune (2021).mkv: vfs cache: downloader: starting 8 streams"],
    ["23:05:12", "NOTICE", "Dropbox: too_many_requests/: retrying in 1s"],
    ["23:07:44", "INFO", "Séries/Severance/S02E03.mkv: vfs cache: downloader: starting 8 streams"]
  );
  if (d.p === "gdrive") lines.push(
    ["23:21:03", "INFO", "Pro/Devis/Devis 2026-11.pdf: vfs cache: queuing for upload in 5s"],
    ["23:21:08", "ERROR", "Photos/2026/IMG_2045.HEIC: Failed to copy: googleapi: Error 403: User rate limit exceeded"],
    ["23:21:14", "INFO", "Photos/2026/IMG_2045.HEIC: Copied (new) after retry 1/10"]
  );
  lines.push(["23:38:00", "INFO", `vfs cache: cleaned: objects 412 (was 415) in use 2, to upload 0, uploading 0, total size ${num(d.cache, 1).replace(",", ".")}Gi`]);
  if (!d.mounted) lines.push(["23:39:12", "INFO", `${remote} Unmounted "${pathOf(d)}"`]);
  return lines;
}

  const o = overlay, pv = providers[o.provider], editing = o.edit ? byId(o.edit) : null;
  const intro = {
    oauth: `Connectez votre compte ${pv.name} dans le navigateur, puis montez-le comme un disque.`,
    login: `Montez votre espace ${pv.name} comme un disque.`,
    s3: "Montez un bucket compatible S3 comme un disque.",
    server: `Montez un serveur ${pv.name} comme un disque.`
  }[pv.kind];
  const required = (field, label, attrs = "") => `<input class="field" data-field="${field}" data-required="Saisissez ${label}." ${attrs}>`;
  const account = o.signedIn
    ? `<div class="signed"><i class="ti ti-circle-check"></i><span>${esc(o.account)}</span><button class="btn" id="dSignIn">Changer de compte…</button></div>`
    : `<button class="btn" id="dSignIn" style="height:30px">${o.waiting ? `<span class="spin"><i class="ti ti-loader-2"></i></span> En attente du navigateur…` : `Se connecter à ${pv.name}…`}</button>`;
  const fields = {
    oauth: `<div class="frow"><label>Compte</label><div class="ctl">${account}</div></div>
      ${o.signedIn ? "" : `<div class="frow"><span></span><span class="hint-line">Votre navigateur s'ouvre pour autoriser CloudShelf.</span></div>`}`,
    login: `
      <div class="frow"><label>Adresse e-mail</label><div class="ctl">${required("email", "l'adresse e-mail", `placeholder="nom@exemple.fr" value="${editing ? esc(editing.account) : ""}"`)}</div></div>
      <div class="frow"><label>Mot de passe</label><div class="ctl">${required("password", "le mot de passe", `type="password" placeholder="${editing ? "Inchangé" : "Mot de passe"}"`)}</div></div>
      <div class="frow"><label>Code 2FA</label><div class="ctl"><input class="field" placeholder="Facultatif"></div></div>`,
    s3: `
      <div class="frow"><label>Point d'accès</label><div class="ctl">${required("endpoint", "le point d'accès", 'placeholder="https://s3.eu-central-1.amazonaws.com"')}</div></div>
      <div class="frow"><label>Bucket</label><div class="ctl">${required("bucket", "le nom du bucket", 'placeholder="mon-bucket"')}</div></div>
      <div class="frow"><label>Clé d'accès</label><div class="ctl">${required("key", "la clé d'accès", 'placeholder="AKIA…"')}</div></div>
      <div class="frow"><label>Clé secrète</label><div class="ctl">${required("secret", "la clé secrète", 'type="password" placeholder="Clé secrète"')}</div></div>`,
    server: `
      <div class="frow"><label>Adresse</label><div class="ctl"><div class="addr">${required("address", "l'adresse du serveur", `placeholder="${pv.host}" value="${editing ? esc(editing.host) : ""}"`)}<span>:</span><input class="field" value="${pv.port}" aria-label="Port"></div></div></div>
      <div class="frow"><label>Chemin d'accès</label><div class="ctl"><input class="field" placeholder="Chemin distant (facultatif)"></div></div>
      <div class="frow"><label>Compte</label><div class="ctl"><input class="field" data-cred placeholder="Nom d'utilisateur" value="${editing ? esc(editing.user) : ""}"></div></div>
      <div class="frow"><label>Mot de passe</label><div class="ctl"><input class="field" data-cred type="password" placeholder="${editing ? "Inchangé" : "Mot de passe"}"></div></div>
      <label class="check indent"><input type="checkbox" id="dAnon"> Anonyme</label>`
  }[pv.kind];
  const defaultProfile = editing ? editing.profile : o.provider === "dropbox" ? "Streaming" : "Documents";
  $("modal").className = "modal add";
  $("modal").innerHTML = `
    <div class="modal-head">
      <button class="close" id="dClose" aria-label="Fermer"><i class="ti ti-x"></i></button>
      <span class="app-icon"></span>
      <div class="grow"><h3>${editing ? `Modifier « ${esc(editing.name)} »` : "Ajouter un nouveau lecteur"}</h3>
        <p>${editing ? "Les changements de connexion s'appliquent au prochain montage." : "Montez un stockage cloud, un NAS ou un serveur comme un disque dans le Finder."}</p></div>
    </div>
    <div class="modal-body">
      <div class="plist">${Object.entries(providers).map(([id, p]) => `
        <button class="pitem ${id === o.provider ? "sel" : editing ? "locked" : ""}" data-p="${id}">${tile(id)}<span><b>${p.name}</b><small>${p.sub}</small></span></button>`).join("")}
      </div>
      <div class="pform" id="pform">
        <div class="pform-head">${tile(o.provider)}<div><h4>${pv.name}</h4><p>${intro}</p></div></div>
        <div class="frow"><label>Nom du volume</label><div class="ctl"><input class="field" data-field="name" value="${esc(o.nameValue ?? (editing ? editing.name : freeName(pv.name)))}"></div></div>
        ${fields}
        <button class="disclosure ${advancedOpen ? "" : "closed"}" id="dAdv"><i class="ti ti-chevron-down"></i>Options avancées</button>
        <div class="adv" ${advancedOpen ? "" : "hidden"}>
          <div class="frow"><label>Profil</label><div><div class="segmented" id="dProfile">${Object.keys(profiles).map(p => `<button class="${p === defaultProfile ? "on" : ""}">${p}</button>`).join("")}</div></div></div>
          <div class="frow"><label>Méthode</label><div class="adv-line">${select("dMethodNew", Object.keys(methods), editing ? editing.method : "NFS intégré")}<span style="margin-left:12px">Délai d'expiration</span><input class="field" value="300" aria-label="Délai d'expiration"><span>secondes</span></div></div>
          <label class="check"><input type="checkbox" data-opt="login" ${!editing || editing.login ? "checked" : ""}> Monter à l'ouverture de session</label>
          <label class="check"><input type="checkbox" data-opt="readOnly" ${editing && editing.readOnly ? "checked" : ""}> Lecture seule</label>
          ${pv.kind === "server" && pv.port !== 22 ? `<label class="check"><input type="checkbox"> Ignorer les erreurs de certificat</label>` : ""}
          <label class="check"><input type="checkbox" data-opt="crypt" id="dCrypt"> Chiffrer les fichiers avant l'envoi (rclone crypt)</label>
          <div class="frow" id="dCryptRow" hidden><label>Phrase secrète</label><div class="ctl"><input class="field" type="password" data-field="cryptPassword" placeholder="Gardez-la en lieu sûr : sans elle, les fichiers sont illisibles"></div></div>
        </div>
      </div>
    </div>
    <div class="modal-foot">
      <div class="test"><button class="btn lg" id="dTest">Tester la connexion</button><span id="dTestResult"></span></div>
      <button class="btn lg" id="dCancel">Annuler</button><button class="btn lg primary" id="dOk">${editing ? "Enregistrer" : "Connecter"}</button>
    </div>`;

  const m = $("modal");
  m.querySelectorAll(".pitem:not(.locked)").forEach(b => b.onclick = () => {
    if (b.dataset.p === o.provider) return;
    overlay = { type: "add", provider: b.dataset.p };
    renderAddDialog();
    m.querySelector(`[data-p="${overlay.provider}"]`).scrollIntoView({ block: "nearest" });
  });
  m.querySelectorAll("input").forEach(i => i.addEventListener("input", () => {
    const err = i.closest(".ctl")?.querySelector(".field-error");
    if (err) err.remove();
    $("dTestResult").textContent = "";
  }));
  $("dAdv").onclick = () => {
    advancedOpen = !advancedOpen;
    $("dAdv").classList.toggle("closed", !advancedOpen);
    m.querySelector(".adv").hidden = !advancedOpen;
  };
  $("dCrypt").onchange = e => { $("dCryptRow").hidden = !e.target.checked; };
  if ($("dAnon")) $("dAnon").onchange = e => m.querySelectorAll("[data-cred]").forEach(i => { i.disabled = e.target.checked; });
  const signIn = $("dSignIn");
  if (signIn) signIn.onclick = () => {
    if (o.waiting) return;
    o.nameValue = m.querySelector('[data-field="name"]').value;
    o.waiting = true;
    o.signedIn = false;
    renderAddDialog();
    setTimeout(() => {
      if (overlay !== o) return;
      o.waiting = false;
      o.signedIn = true;
      o.account = editing ? editing.account : "nom@exemple.fr";
      renderAddDialog();
    }, 1400);
  };
  m.querySelectorAll("#dProfile button").forEach(b => b.onclick = () => m.querySelectorAll("#dProfile button").forEach(x => x.classList.toggle("on", x === b)));
  [$("dClose"), $("dCancel")].forEach(b => b.onclick = closeOverlay);
  $("dTest").onclick = () => {
    if (!validateDialog(false)) return;
    const out = $("dTestResult");
    out.innerHTML = `<span class="spin"><i class="ti ti-loader-2"></i></span> Test en cours…`;
    setTimeout(() => {
      if (overlay !== o) return;
      out.innerHTML = `<span class="ok"><i class="ti ti-circle-check"></i>Connexion réussie${editing ? ` · ${fmtTo(editing.total - editing.used)} libres` : ""}</span>`;
    }, 1100);
  };
  $("dOk").onclick = () => {
    if (!validateDialog(true)) return;
    const value = sel => m.querySelector(sel);
    const name = value('[data-field="name"]').value.trim();
    const profile = m.querySelector("#dProfile .on").textContent;
    const method = $("dMethodNew").value;
    const login = value('[data-opt="login"]').checked;
    const readOnly = value('[data-opt="readOnly"]').checked;
    if (editing) {
      renameDrive(editing, name);
      Object.assign(editing, { profile, method, login, readOnly });
      closeOverlay();
      render();
      toast(`Modifications de « ${editing.name} » enregistrées`);
      return;
    }
    const accountValue = pv.kind === "oauth" ? o.account
      : pv.kind === "login" ? value('[data-field="email"]').value.trim()
      : pv.kind === "s3" ? value('[data-field="bucket"]').value.trim()
      : (m.querySelector("[data-cred]").value.trim() || value('[data-field="address"]').value.trim());
    const d = { ...blank(), id: nextId++, name, p: o.provider, account: accountValue, mounted: true, profile, method, login, readOnly,
      cacheMax: profile === "Streaming" ? 200 : profile === "Documents" ? 20 : 5, used: 0, total: o.provider === "dropbox" ? 2 : 1, lastRefresh: 0 };
    drives.push(d);
    history[d.id] = Array(SAMPLES).fill(0);
    closeOverlay();
    query = "";
    page = "drives";
    render();
    toast(`« ${d.name} » monté sur ${pathOf(d)}`);
  };
}

function validateDialog(includeName) {
  const o = overlay, m = $("modal"), errors = [];
  m.querySelectorAll(".field-error").forEach(e => e.remove());
  const fail = (el, message) => {
    const div = document.createElement("div");
    div.className = "field-error";
    div.textContent = message;
    el.closest(".ctl").append(div);
    errors.push(el);
  };
  if (includeName) {
    const n = m.querySelector('[data-field="name"]');
    const error = nameError(n.value, o.edit);
    if (error) fail(n, error);
  }
  m.querySelectorAll("[data-required]").forEach(i => {
    if (o.edit && i.type === "password") return;
    if (!i.value.trim()) fail(i, i.dataset.required);
  });
  if (providers[o.provider].kind === "oauth" && !o.signedIn) fail($("dSignIn"), `Connectez-vous à ${providers[o.provider].name} pour continuer.`);
  if ($("dCrypt").checked) {
    const pw = m.querySelector('[data-field="cryptPassword"]');
    if (!pw.value) fail(pw, "Saisissez une phrase secrète de chiffrement.");
  }
  if (errors.length) {
    if (errors.some(e => e.closest(".adv")) && !advancedOpen) $("dAdv").click();
    errors[0].focus();
    $("dTestResult").textContent = "";
  }
  return errors.length === 0;
}

function driveLine(d) {
  if (!d.mounted) return "Non monté";
  const activity = [d.read > 0 ? `↓ ${fmtSpeed(d.read)}` : "", d.write > 0 ? `↑ ${fmtSpeed(d.write)}` : ""].filter(Boolean).join(" ") || "Inactif";
  return `${activity} · ${fmtTo(d.total - d.used)} libres`;
}

function miniArea(values) {
  const max = Math.max(250, ...values);
  const pts = values.map((v, i) => `${(i / (values.length - 1) * 100).toFixed(1)},${(22 - v / max * 20).toFixed(1)}`).join(" ");
  return `<svg viewBox="0 0 100 22" preserveAspectRatio="none" aria-hidden="true"><polygon points="0,22 ${pts} 100,22" fill="var(--accent-soft)"/><polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg>`;
}

function updateMenuSpeed() {
  const total = sum("read") + sum("write");
  $("menuSpeed").textContent = total > 0 ? fmtSpeed(total) : "";
}

function renderPopover() {
  updateMenuSpeed();
  const panel = $("popover");
  if (!panel.classList.contains("open")) return;
  const mounted = drives.filter(d => d.mounted).length;
  const uploads = transfers.filter(t => byId(t.drive) && t.progress > 0);
  const scrollTop = $("pList") ? $("pList").scrollTop : 0;
  panel.innerHTML = `
    <div class="p-head">
      <span class="app-icon"></span>
      <div class="grow"><b>CloudShelf</b><small>${mounted} montés sur ${plural(drives.length, "lecteur")}</small></div>
      <button class="p-btn" data-p="add" aria-label="Ajouter un lecteur"><i class="ti ti-plus"></i></button>
      <button class="p-btn" data-p="settings" aria-label="Paramètres"><i class="ti ti-settings"></i></button>
    </div>
    <div class="p-rates">
      <div class="p-rate"><div class="label"><i class="ti ti-arrow-down"></i>Lecture</div><div class="value" id="pRead">${fmtSpeed(sum("read"))}</div><div id="pSpark">${miniArea(Array.from({ length: SAMPLES }, (_, i) => totalRead(i)))}</div></div>
      <div class="p-rate"><div class="label"><i class="ti ti-arrow-up"></i>Écriture</div><div class="value" id="pWrite">${fmtSpeed(sum("write"))}</div><div class="sub">${uploads.length ? `${plural(uploads.length, "fichier")} en cours` : "Aucun envoi"}</div></div>
    </div>
    <div class="p-section">Lecteurs<span>${drives.length}</span></div>
    <div class="p-list" id="pList">
    ${drives.map(d => `<div class="p-drive ${d.mounted ? "" : "off"}" data-id="${d.id}" title="${d.mounted ? "Afficher dans le Finder" : "Monter"}">${tile(d.p)}
      <div class="info"><div>${esc(d.name)}</div><small data-pline="${d.id}">${driveLine(d)}</small></div>
      ${d.mounted ? `<i class="ti ti-folder go" aria-hidden="true"></i>` : `<button class="p-mount" aria-label="Monter ${esc(d.name)}">Monter</button>`}</div>`).join("")}
    </div>
    ${uploads.length ? `<div class="p-section">Envois<span>${fmtSpeed(sum("write"))}</span></div>
    ${uploads.map(t => { const d = byId(t.drive); return `<div class="p-xfer">${tile(d.p)}
      <div><div class="name">${esc(t.file)}</div><div class="bar"><span style="width:${t.progress * 100}%"></span></div></div>
      <span class="pct">${Math.round(t.progress * 100)} %</span></div>`; }).join("")}` : ""}
    <div class="p-sep"></div>
    <button class="p-item" data-p="open">Ouvrir CloudShelf</button>
    <div class="p-sep"></div>
    <button class="p-item" data-p="quit">Quitter CloudShelf<span class="kbd">⌘Q</span></button>`;

  const list = $("pList");
  list.scrollTop = scrollTop;
  list.classList.toggle("scrolls", list.scrollHeight > list.clientHeight);
  list.querySelectorAll(".p-drive").forEach(row => {
    const d = byId(+row.dataset.id);
    row.onclick = () => {
      if (d.mounted) { runAction(d, "finder"); closePanel(); return; }
      toggleMount(d);
      render();
    };
  });
  panel.querySelectorAll("[data-p]").forEach(b => b.onclick = () => {
    const act = b.dataset.p;
    closePanel();
    if (act === "add") openOverlay({ type: "add", provider: "webdav" });
    else if (act === "settings") go("settings");
    else if (act === "open") go("drives");
    else if (act === "quit") {
      const count = drives.filter(d => d.mounted).length;
      openOverlay({
        type: "alert", title: "Quitter CloudShelf ?",
        message: count ? `${count} lecteurs montés seront démontés. Les envois non terminés reprendront au prochain lancement.` : "Aucun lecteur n'est monté.",
        confirm: "Quitter",
        run: () => { drives.forEach(d => { d.mounted = false; d.read = 0; d.write = 0; }); render(); toast("CloudShelf quitté, lecteurs démontés"); }
      });
    }
  });
}

function updatePopover() {
  updateMenuSpeed();
  if (!$("popover").classList.contains("open")) return;
  $("pRead").textContent = fmtSpeed(sum("read"));
  $("pWrite").textContent = fmtSpeed(sum("write"));
  $("pSpark").innerHTML = miniArea(Array.from({ length: SAMPLES }, (_, i) => totalRead(i)));
  drives.forEach(d => { const el = document.querySelector(`[data-pline="${d.id}"]`); if (el) el.textContent = driveLine(d); });
}

function openPanel() {
  const panel = $("popover"), btn = $("menuExtra");
  panel.classList.add("open");
  btn.classList.add("active");
  btn.setAttribute("aria-expanded", "true");
  renderPopover();
  const bar = panel.parentElement.getBoundingClientRect(), r = btn.getBoundingClientRect();
  panel.style.left = `${Math.max(8, Math.min(r.left - bar.left - 6, bar.width - panel.offsetWidth - 8))}px`;
}

function closePanel() {
  $("popover").classList.remove("open");
  $("menuExtra").classList.remove("active");
  $("menuExtra").setAttribute("aria-expanded", "false");
}

function render() {
  renderNav();
  renderHeader();
  renderPage();
  renderPopover();
  renderMenu();
}

function tick() {
  drives.forEach(d => {
    if (d.mounted && d.read > 0) d.read = Math.max(20, Math.min(230, d.read + (Math.random() - 0.5) * 30));
    history[d.id].push(d.mounted ? d.read : 0);
    history[d.id].shift();
  });
  updateSubtitle();
  updatePopover();
  if (page === "drives") {
    drives.forEach(d => { const el = document.querySelector(`[data-io="${d.id}"]`); if (el) el.innerHTML = ioRows(d); });
  } else if (page === "activity") {
    $("statRead").textContent = fmtSpeed(sum("read"));
    drives.forEach(d => { const el = document.querySelector(`[data-read="${d.id}"]`); if (el) el.textContent = d.mounted ? fmtSpeed(d.read) : "—"; });
    drawChart();
  } else if (typeof page === "object") {
    const d = byId(page.drive);
    $("liveRead").textContent = fmtSpeed(d.read);
    $("spark").innerHTML = sparkline(history[d.id]);
  }
}

$("notesBtn").onclick = openNotes;
$("aboutBtn").onclick = () => openOverlay({ type: "about" });
$("menuExtra").onclick = e => { e.stopPropagation(); if ($("popover").classList.contains("open")) closePanel(); else openPanel(); };
$("popover").onclick = e => e.stopPropagation();
document.addEventListener("click", e => {
  closePanel();
  if (menu && !e.target.closest("#menu")) { menu = null; renderMenu(); }
});
document.addEventListener("contextmenu", e => { if (menu && !e.target.closest(".dcard")) { menu = null; renderMenu(); } });
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if ($("popover").classList.contains("open")) closePanel();
  else if (menu) { menu = null; renderMenu(); }
  else if (overlay) closeOverlay();
});
document.querySelectorAll("#appearance button").forEach(b => b.onclick = () => {
  document.querySelectorAll("#appearance button").forEach(x => x.classList.toggle("on", x === b));
  if (b.dataset.theme) document.documentElement.dataset.theme = b.dataset.theme;
  else delete document.documentElement.dataset.theme;
  try { localStorage.setItem("cloudshelf-theme", b.dataset.theme); } catch (e) {}
});
try {
  const saved = localStorage.getItem("cloudshelf-theme");
  if (saved) document.querySelector(`#appearance [data-theme="${saved}"]`).click();
} catch (e) {}

function fit() {
  const s = Math.min(1, (window.innerWidth - 32) / 1120);
  $("scaler").style.transform = `scale(${s})`;
  $("scaler").style.height = `${(760 + 28) * s}px`;
}
window.addEventListener("resize", () => { fit(); if (page === "activity") drawChart(); });
fit();
render();
setInterval(tick, 1000);
</script>
</body>
</html>
