<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CloudShelf maquette</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
:root {
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
  --accent: #007aff;
  --accent-soft: rgba(0, 122, 255, .14);
  --green: #28cd41;
  --orange: #ff9500;
  --red: #ff3b30;
  --wallpaper: linear-gradient(135deg, #8ec5fc 0%, #b8a9f5 45%, #f6b8c8 100%);
  --menubar: rgba(255, 255, 255, .3);
  --window: rgba(255, 255, 255, .94);
  --sidebar: rgba(244, 244, 247, .78);
  --glass: rgba(255, 255, 255, .72);
  --glass-border: rgba(0, 0, 0, .08);
  --group: rgba(0, 0, 0, .035);
  --separator: rgba(0, 0, 0, .08);
  --grid: rgba(0, 0, 0, .06);
  --hover: rgba(0, 0, 0, .05);
  --selected: rgba(0, 0, 0, .08);
  --text: #1d1d1f;
  --text-2: rgba(29, 29, 31, .62);
  --text-3: rgba(29, 29, 31, .42);
  --control: #fff;
  --control-border: rgba(0, 0, 0, .12);
  --tooltip: rgba(255, 255, 255, .96);
  --scrim: rgba(0, 0, 0, .18);
  --shadow: 0 30px 80px rgba(0, 0, 0, .28), 0 0 0 .5px rgba(0, 0, 0, .18);
  --sheet-shadow: 0 20px 60px rgba(0, 0, 0, .3), 0 0 0 .5px rgba(0, 0, 0, .15);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --accent: #0a84ff;
    --accent-soft: rgba(10, 132, 255, .24);
    --green: #30d158;
    --orange: #ff9f0a;
    --red: #ff453a;
    --wallpaper: linear-gradient(135deg, #16243f 0%, #2a1c4a 50%, #401b33 100%);
    --menubar: rgba(0, 0, 0, .3);
    --window: rgba(32, 32, 34, .92);
    --sidebar: rgba(48, 48, 52, .62);
    --glass: rgba(70, 70, 74, .55);
    --glass-border: rgba(255, 255, 255, .1);
    --group: rgba(255, 255, 255, .05);
    --separator: rgba(255, 255, 255, .09);
    --grid: rgba(255, 255, 255, .07);
    --hover: rgba(255, 255, 255, .06);
    --selected: rgba(255, 255, 255, .1);
    --text: #f5f5f7;
    --text-2: rgba(245, 245, 247, .62);
    --text-3: rgba(245, 245, 247, .4);
    --control: rgba(255, 255, 255, .09);
    --control-border: rgba(255, 255, 255, .13);
    --tooltip: rgba(44, 44, 48, .97);
    --scrim: rgba(0, 0, 0, .38);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --accent: #0a84ff;
  --accent-soft: rgba(10, 132, 255, .24);
  --green: #30d158;
  --orange: #ff9f0a;
  --red: #ff453a;
  --wallpaper: linear-gradient(135deg, #16243f 0%, #2a1c4a 50%, #401b33 100%);
  --menubar: rgba(0, 0, 0, .3);
  --window: rgba(32, 32, 34, .92);
  --sidebar: rgba(48, 48, 52, .62);
  --glass: rgba(70, 70, 74, .55);
  --glass-border: rgba(255, 255, 255, .1);
  --group: rgba(255, 255, 255, .05);
  --separator: rgba(255, 255, 255, .09);
  --grid: rgba(255, 255, 255, .07);
  --hover: rgba(255, 255, 255, .06);
  --selected: rgba(255, 255, 255, .1);
  --text: #f5f5f7;
  --text-2: rgba(245, 245, 247, .62);
  --text-3: rgba(245, 245, 247, .4);
  --control: rgba(255, 255, 255, .09);
  --control-border: rgba(255, 255, 255, .13);
  --tooltip: rgba(44, 44, 48, .97);
  --scrim: rgba(0, 0, 0, .38);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { font: 13px/1.4 var(--font); color: var(--text); background: var(--wallpaper); background-attachment: fixed; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
button { font: inherit; color: inherit; }
.stage { min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
.menubar { align-self: stretch; height: 28px; display: flex; justify-content: flex-end; align-items: center; gap: 4px; padding: 0 12px; background: var(--menubar); backdrop-filter: blur(20px); position: relative; z-index: 5; }
.menubar .item { padding: 2px 8px; border-radius: 5px; border: 0; background: none; cursor: default; display: flex; align-items: center; gap: 4px; }
.menubar .item.active { background: var(--selected); }
.menubar .item i { font-size: 16px; }
.menubar .speed { font-variant-numeric: tabular-nums; font-size: 11px; }
.scaler { padding: 28px 16px 0; transform-origin: top center; }
.window { width: 1120px; height: 720px; border-radius: 26px; background: var(--window); backdrop-filter: blur(40px) saturate(1.4); box-shadow: var(--shadow); display: flex; position: relative; overflow: hidden; }
.appearance { margin: 18px 0 40px; display: flex; align-items: center; gap: 10px; color: var(--text); }
.appearance span { font-size: 12px; color: var(--text-2); }

.sidebar { width: 232px; margin: 8px; border-radius: 18px; background: var(--sidebar); border: .5px solid var(--glass-border); display: flex; flex-direction: column; flex-shrink: 0; }
.lights { display: flex; gap: 8px; padding: 16px 14px 14px; }
.lights span { width: 12px; height: 12px; border-radius: 50%; }
.lights span:nth-child(1) { background: #ff5f57; }
.lights span:nth-child(2) { background: #febc2e; }
.lights span:nth-child(3) { background: #28c840; }
.side-scroll { flex: 1; overflow: auto; padding: 0 10px; }
.side-title { font-size: 11px; font-weight: 600; color: var(--text-3); padding: 14px 8px 3px; }
.nav { display: flex; align-items: center; gap: 8px; width: 100%; height: 28px; padding: 0 8px; border: 0; background: none; border-radius: 7px; text-align: left; cursor: default; }
.nav:hover { background: var(--hover); }
.nav.sel { background: var(--selected); }
.nav .name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nav .meta { font-size: 11px; color: var(--text-2); font-variant-numeric: tabular-nums; }
.nav .symbol { width: 20px; text-align: center; color: var(--accent); font-size: 17px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-3); flex-shrink: 0; }
.dot.on { background: var(--green); }
.dot.busy { background: var(--orange); }
.dot.err { background: var(--red); }
.tile { width: 20px; height: 20px; border-radius: 5px; display: grid; place-items: center; color: #fff; flex-shrink: 0; box-shadow: inset 0 0 0 .5px rgba(255, 255, 255, .16); }
.tile svg { width: 62%; height: 62%; fill: currentColor; }
.tile i { font-size: 13px; }
.side-foot { padding: 8px 10px 10px; display: flex; }

.main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.toolbar { height: 52px; display: flex; align-items: center; gap: 10px; padding: 0 16px 0 8px; margin-top: 8px; }
.toolbar h1 { font-size: 15px; font-weight: 600; margin: 0; flex: 1; }
.glass-group { display: flex; background: var(--glass); border: .5px solid var(--glass-border); border-radius: 999px; padding: 2px; backdrop-filter: blur(20px); }
.glass-btn { height: 32px; min-width: 36px; padding: 0 10px; border: 0; background: none; border-radius: 999px; display: flex; align-items: center; justify-content: center; gap: 6px; cursor: default; }
.glass-btn:hover { background: var(--hover); }
.glass-btn i { font-size: 17px; }
.content { flex: 1; overflow: auto; padding: 4px 28px 28px 20px; }

.hero { display: flex; align-items: center; gap: 14px; padding: 6px 0 18px; }
.hero .tile { width: 52px; height: 52px; border-radius: 13px; }
.hero .tile i { font-size: 30px; }
.hero h2 { font-size: 20px; font-weight: 600; margin: 0; }
.hero p { margin: 2px 0 0; color: var(--text-2); }
.status { display: inline-flex; align-items: center; gap: 6px; }

.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 4px; }
.stat { background: var(--group); border-radius: 12px; padding: 10px 12px; }
.stat .label { font-size: 11px; color: var(--text-2); }
.stat .value { font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; margin-top: 2px; }
.stat .sub { font-size: 11px; color: var(--text-3); }
.stat svg { display: block; width: 100%; height: 24px; margin-top: 4px; }
.bar { height: 4px; border-radius: 2px; background: var(--separator); margin-top: 8px; overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--accent); border-radius: 2px; }

.section-title { font-size: 13px; font-weight: 600; margin: 18px 0 6px 2px; }
.group { background: var(--group); border-radius: 12px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 9px 12px; min-height: 40px; }
.row + .row { border-top: .5px solid var(--separator); margin: 0 12px; padding-left: 0; padding-right: 0; }
.row .hint { font-size: 11px; color: var(--text-2); margin-top: 1px; }
.footnote { font-size: 11px; color: var(--text-2); margin: 6px 2px 0; }

.chart-card { background: var(--group); border-radius: 12px; padding: 12px 12px 8px; position: relative; }
.chart-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
.chart-head b { font-weight: 600; }
.chart-head span { font-size: 11px; color: var(--text-2); }
#chart { display: block; width: 100%; height: 150px; outline: none; }
#chart text { font-size: 10px; fill: var(--text-3); font-variant-numeric: tabular-nums; }
.tooltip { position: absolute; pointer-events: none; background: var(--tooltip); border: .5px solid var(--glass-border); border-radius: 8px; padding: 7px 9px; box-shadow: 0 6px 18px rgba(0, 0, 0, .14); min-width: 150px; display: none; font-size: 11px; }
.tooltip .when { color: var(--text-2); margin-bottom: 3px; }
.tooltip .line { display: flex; align-items: center; gap: 6px; }
.tooltip .line b { font-weight: 600; font-variant-numeric: tabular-nums; min-width: 58px; }
.tooltip .line span { color: var(--text-2); }
.tooltip .key { width: 10px; height: 2px; border-radius: 1px; background: var(--accent); }
.tooltip .total { font-size: 13px; }

.table { background: var(--group); border-radius: 12px; }
.trow { display: grid; grid-template-columns: minmax(0, 2.2fr) 1.1fr .9fr .9fr 1.4fr; align-items: center; gap: 12px; padding: 0 12px; height: 44px; cursor: default; }
.trow + .trow { border-top: .5px solid var(--separator); }
.trow.head { height: 30px; font-size: 11px; color: var(--text-2); }
.trow:not(.head):hover { background: var(--hover); }
.trow .who { display: flex; align-items: center; gap: 9px; min-width: 0; }
.trow .who .tile { width: 24px; height: 24px; border-radius: 6px; }
.trow .who small { display: block; font-size: 11px; color: var(--text-2); }
.num { font-variant-numeric: tabular-nums; text-align: right; }
.trow .space { display: flex; align-items: center; gap: 8px; }
.trow .space .bar { flex: 1; margin: 0; }
.trow .space span { font-size: 11px; color: var(--text-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
.xfer { display: grid; grid-template-columns: 24px minmax(0, 1fr) 140px 70px; gap: 12px; align-items: center; padding: 8px 12px; }
.xfer + .xfer { border-top: .5px solid var(--separator); }
.xfer .tile { width: 24px; height: 24px; border-radius: 6px; }
.xfer small { display: block; font-size: 11px; color: var(--text-2); }
.xfer .bar { margin: 0; }

.switch { width: 38px; height: 22px; border-radius: 11px; background: var(--separator); position: relative; border: 0; flex-shrink: 0; cursor: default; transition: background .2s; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .25); transition: transform .2s; }
.switch.on { background: var(--green); }
.switch.on::after { transform: translateX(16px); }
.popup { height: 24px; padding: 0 6px 0 9px; border-radius: 6px; border: .5px solid var(--control-border); background: var(--control); display: inline-flex; align-items: center; gap: 6px; cursor: default; box-shadow: 0 .5px 1px rgba(0, 0, 0, .06); }
.popup i { font-size: 12px; color: var(--text-2); }
.btn { height: 24px; padding: 0 12px; border-radius: 6px; border: .5px solid var(--control-border); background: var(--control); cursor: default; box-shadow: 0 .5px 1px rgba(0, 0, 0, .06); }
.btn.primary { background: var(--accent); border-color: transparent; color: #fff; }
.btn.lg { height: 30px; padding: 0 16px; border-radius: 8px; }
.btn.destructive { color: var(--red); }
.segmented { display: inline-flex; background: var(--separator); border-radius: 7px; padding: 2px; }
.segmented button { border: 0; background: none; padding: 3px 12px; border-radius: 5px; cursor: default; }
.segmented button.on { background: var(--control); box-shadow: 0 1px 2px rgba(0, 0, 0, .15); }
:root[data-theme="dark"] .segmented button.on { background: rgba(255, 255, 255, .18); }
.field { height: 26px; border-radius: 6px; border: .5px solid var(--control-border); background: var(--control); padding: 0 8px; font: inherit; color: inherit; width: 280px; }
.field::placeholder { color: var(--text-3); }
.field:focus { outline: 3px solid var(--accent-soft); border-color: var(--accent); }
.mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; }

.scrim { position: absolute; inset: 0; background: var(--scrim); display: none; align-items: flex-start; justify-content: center; padding-top: 36px; z-index: 10; }
.scrim.open { display: flex; }
.sheet { width: 600px; background: var(--window); backdrop-filter: blur(40px); border-radius: 22px; box-shadow: var(--sheet-shadow); overflow: hidden; }
.sheet-head { padding: 18px 20px 12px; display: flex; align-items: center; gap: 10px; }
.sheet-head h3 { font-size: 15px; font-weight: 600; margin: 0; flex: 1; }
.sheet-head .tile { width: 26px; height: 26px; border-radius: 7px; }
.back { width: 26px; height: 26px; border-radius: 50%; border: 0; background: var(--separator); display: grid; place-items: center; cursor: default; }
.search { display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 9px; border-radius: 8px; background: var(--separator); margin: 0 20px 4px; color: var(--text-2); }
.search input { border: 0; background: none; font: inherit; color: var(--text); flex: 1; outline: none; }
.sheet-body { padding: 0 20px 6px; max-height: 520px; overflow: auto; }
.providers { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.provider { border: 0; background: var(--group); border-radius: 12px; padding: 14px 6px 10px; display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: default; }
.provider:hover { background: var(--selected); }
.provider .tile { width: 38px; height: 38px; border-radius: 10px; }
.provider .tile i { font-size: 22px; }
.sheet-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 20px 18px; }
.sheet .group .row { padding-top: 7px; padding-bottom: 7px; }

.popover { position: absolute; top: 34px; right: 12px; width: 300px; background: var(--window); backdrop-filter: blur(40px); border-radius: 16px; box-shadow: var(--sheet-shadow); padding: 8px; display: none; z-index: 20; }
.popover.open { display: block; }
.pop-row { display: flex; align-items: center; gap: 9px; padding: 6px 8px; border-radius: 8px; }
.pop-row:hover { background: var(--hover); }
.pop-row .name { flex: 1; }
.pop-row .meta { font-size: 11px; color: var(--text-2); font-variant-numeric: tabular-nums; }
.pop-sep { height: .5px; background: var(--separator); margin: 6px 8px; }
.pop-link { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 6px 8px; border-radius: 8px; cursor: default; }
.pop-link:hover { background: var(--accent); color: #fff; }
.pop-head { display: flex; justify-content: space-between; align-items: baseline; padding: 4px 8px 6px; }
.pop-head b { font-weight: 600; }
</style>
</head>
<body>
<div class="stage">
  <div class="menubar">
    <button class="item" id="menuExtra" aria-label="Lecteurs CloudShelf"><i class="ti ti-cloud"></i><span class="speed" id="menuSpeed"></span></button>
    <span class="item">Dim. 1 nov. 22:30</span>
    <div class="popover" id="popover"></div>
  </div>

  <div class="scaler" id="scaler">
    <div class="window">
      <aside class="sidebar">
        <div class="lights"><span></span><span></span><span></span></div>
        <div class="side-scroll" id="sidebar"></div>
        <div class="side-foot">
          <button class="glass-btn" id="addBtn" aria-label="Ajouter un lecteur"><i class="ti ti-plus"></i></button>
        </div>
      </aside>
      <section class="main">
        <div class="toolbar">
          <h1 id="title"></h1>
          <div class="glass-group" id="actions"></div>
        </div>
        <div class="content" id="detail"></div>
      </section>
      <div class="scrim" id="scrim"><div class="sheet" id="sheet"></div></div>
    </div>
  </div>

  <div class="appearance" id="appearanceBar">
    <span>Apparence</span>
    <div class="segmented" id="appearance">
      <button class="on" data-theme="">Auto</button><button data-theme="light">Clair</button><button data-theme="dark">Sombre</button>
    </div>
  </div>
</div>

const totalRead = i => drives.reduce((s, d) => s + history[d.id][i], 0);

function sparkline(values) {
  const max = Math.max(250, ...values);
  const pts = values.map((v, i) => `${(i / (values.length - 1) * 100).toFixed(1)},${(23 - v / max * 21).toFixed(1)}`).join(" ");
  return `<svg viewBox="0 0 100 24" preserveAspectRatio="none" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg>`;
}

function drawChart() {
  const svg = $("chart");
  if (!svg) return;
  const w = svg.clientWidth, h = svg.clientHeight, { left, right, top, bottom } = PLOT;
  const values = Array.from({ length: SAMPLES }, (_, i) => totalRead(i));
  const max = Math.max(300, Math.ceil(Math.max(...values) / 100) * 100);
  const x = i => left + i / (SAMPLES - 1) * (w - left - right);
  const y = v => top + (1 - v / max) * (h - top - bottom);
  const ticks = [0, max / 2, max];
  const line = values.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  let out = ticks.map(t => `<line x1="${left}" x2="${w - right}" y1="${y(t)}" y2="${y(t)}" stroke="var(--grid)" stroke-width="1"/>
    <text x="${left - 6}" y="${y(t) + 3}" text-anchor="end">${Math.round(t)} Mo/s</text>`).join("");
  out += `<text x="${left}" y="${h - 4}">-60 s</text><text x="${(left + w - right) / 2}" y="${h - 4}" text-anchor="middle">-30 s</text><text x="${w - right}" y="${h - 4}" text-anchor="end">maintenant</text>`;
  out += `<polygon points="${x(0)},${y(0)} ${line} ${x(SAMPLES - 1)},${y(0)}" fill="var(--accent-soft)"/>`;
  out += `<polyline points="${line}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  if (hoverIndex !== null) {
    const hx = x(hoverIndex), hy = y(values[hoverIndex]);
    out += `<line x1="${hx}" x2="${hx}" y1="${top}" y2="${h - bottom}" stroke="var(--text-3)" stroke-width="1"/>
      <circle cx="${hx}" cy="${hy}" r="4.5" fill="var(--accent)" stroke="var(--window)" stroke-width="2"/>`;
  }
  svg.innerHTML = out;
  renderTooltip(hoverIndex === null ? null : { left: x(hoverIndex), w });
}

function renderTooltip(pos) {
  const tip = $("tooltip");
  if (!pos) { tip.style.display = "none"; return; }
  tip.replaceChildren();
  const ago = SAMPLES - 1 - hoverIndex;
  const when = document.createElement("div");
  when.className = "when";
  when.textContent = ago === 0 ? "Maintenant" : `Il y a ${ago} s`;
  tip.append(when);
  const addLine = (value, label, strong) => {
    const row = document.createElement("div");
    row.className = "line" + (strong ? " total" : "");
    const key = document.createElement("span");
    key.className = "key";
    if (!strong) key.style.opacity = "0";
    const b = document.createElement("b");
    b.textContent = fmtSpeed(value);
    const name = document.createElement("span");
    name.textContent = label;
    row.append(key, b, name);
    tip.append(row);
  };
  addLine(totalRead(hoverIndex), "Total", true);
  drives.filter(d => history[d.id][hoverIndex] > 0).forEach(d => addLine(history[d.id][hoverIndex], d.name, false));
  tip.style.display = "block";
  const tw = tip.offsetWidth;
  const leftPx = pos.left + 24 + tw > pos.w ? pos.left - tw : pos.left + 24;
  tip.style.left = `${Math.max(8, leftPx)}px`;
  tip.style.top = "18px";
}

function bindChart() {
  const svg = $("chart");
  const indexAt = clientX => {
    const r = svg.getBoundingClientRect(), k = r.width / svg.clientWidth, left = PLOT.left * k, right = PLOT.right * k;
    return Math.max(0, Math.min(SAMPLES - 1, Math.round((clientX - r.left - left) / (r.width - left - right) * (SAMPLES - 1))));
  };
  svg.onpointermove = e => { hoverIndex = indexAt(e.clientX); drawChart(); };
  svg.onpointerleave = () => { hoverIndex = null; drawChart(); };
  svg.onfocus = () => { if (hoverIndex === null) { hoverIndex = SAMPLES - 1; drawChart(); } };
  svg.onblur = () => { hoverIndex = null; drawChart(); };
  svg.onkeydown = e => {
    if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
    e.preventDefault();
    hoverIndex = Math.max(0, Math.min(SAMPLES - 1, (hoverIndex ?? SAMPLES - 1) + (e.key === "ArrowLeft" ? -1 : 1)));
    drawChart();
  };
}

    $("sheet").innerHTML = `
      <div class="sheet-head"><h3>Ajouter un lecteur</h3></div>
      <label class="search"><i class="ti ti-search"></i><input id="q" placeholder="Rechercher un service"></label>
      <div class="sheet-body" id="catalog"></div>
      <div class="sheet-foot"><button class="btn lg" data-close>Annuler</button></div>`;
    const draw = q => {
      $("catalog").innerHTML = catalog.map(([title, ids]) => {
        const list = ids.filter(id => providers[id].name.toLowerCase().includes(q));
        return list.length ? `<div class="section-title">${title}</div><div class="providers">${list.map(id => `
          <button class="provider" data-p="${id}">${tile(id)}<span>${providers[id].name}</span></button>`).join("")}</div>` : "";
      }).join("");
      document.querySelectorAll(".provider").forEach(b => b.onclick = () => { sheetStep = b.dataset.p; renderSheet(); });
    };
    draw("");
    $("q").oninput = e => draw(e.target.value.toLowerCase());
  } else {
    const pv = providers[sheetStep];
    const fields = pv.oauth ? `
      <div class="row"><div>Nom</div><input class="field" value="${pv.name}"></div>
      <div class="row"><div>Compte<div class="hint">Votre navigateur s'ouvre pour autoriser l'accès.</div></div><button class="btn">Se connecter à ${pv.name}…</button></div>` : `
      <div class="row"><div>Nom</div><input class="field" placeholder="${pv.name}"></div>
      <div class="row"><div>Adresse</div><input class="field" placeholder="https://serveur.exemple.fr/dav"></div>
      <div class="row"><div>Utilisateur</div><input class="field" placeholder="nom@exemple.fr"></div>
      <div class="row"><div>Mot de passe</div><input class="field" type="password"></div>`;
    $("sheet").innerHTML = `
      <div class="sheet-head"><button class="back" id="back" aria-label="Retour"><i class="ti ti-chevron-left"></i></button>${tile(sheetStep)}<h3>${pv.name}</h3></div>
      <div class="sheet-body">
        <div class="group">${fields}</div>
        <div class="section-title">Utilisation</div>
        <div class="group"><div class="row"><div>Profil</div>
          <div class="segmented" id="newProfile">${Object.keys(profiles).map((p, i) => `<button class="${i === 1 ? "on" : ""}">${p}</button>`).join("")}</div></div>
          <div class="row"><div>Monter à l'ouverture de session</div><button class="switch on" aria-label="Monter à l'ouverture de session"></button></div></div>
        ${pv.oauth ? "" : `<p class="footnote">Le mot de passe est enregistré dans le Trousseau.</p>`}
      </div>
      <div class="sheet-foot"><button class="btn lg" data-close>Annuler</button><button class="btn lg primary" data-close>Ajouter</button></div>`;
    $("back").onclick = () => { sheetStep = "pick"; renderSheet(); };
    document.querySelectorAll("#newProfile button").forEach(b => b.onclick = () => { document.querySelectorAll("#newProfile button").forEach(x => x.classList.remove("on")); b.classList.add("on"); });
    $("sheet").querySelectorAll(".switch").forEach(s => s.onclick = () => s.classList.toggle("on"));
  }
  $("sheet").querySelectorAll("[data-close]").forEach(b => b.onclick = () => { sheetStep = null; renderSheet(); });
}

function render() {
  renderSidebar();
  renderActions();
  if (selected === "activity") renderActivity(); else renderDrive();
  renderPopover();
}

function tick() {
  drives.forEach(d => {
    if (d.mounted && d.read > 0) d.read = Math.max(20, Math.min(230, d.read + (Math.random() - 0.5) * 30));
    history[d.id].push(d.mounted ? d.read : 0);
    history[d.id].shift();
  });
  renderSidebar();
  renderPopover();
  if (selected === "activity") {
    $("statRead").textContent = fmtSpeed(drives.reduce((s, d) => s + d.read, 0));
    drives.forEach(d => { const c = document.querySelector(`[data-read="${d.id}"]`); if (c) c.textContent = d.mounted ? fmtSpeed(d.read) : "—"; });
    drawChart();
  } else {
    const d = drives.find(x => x.id === selected);
    $("liveRead").textContent = fmtSpeed(d.read);
    $("spark").innerHTML = sparkline(history[d.id]);
  }
}

$("addBtn").onclick = () => { sheetStep = "pick"; renderSheet(); };
$("menuExtra").onclick = e => { e.stopPropagation(); $("popover").classList.toggle("open"); $("menuExtra").classList.toggle("active"); };
document.addEventListener("click", e => { if (!$("popover").contains(e.target)) { $("popover").classList.remove("open"); $("menuExtra").classList.remove("active"); } });
document.querySelectorAll("#appearance button").forEach(b => b.onclick = () => {
  document.querySelectorAll("#appearance button").forEach(x => x.classList.toggle("on", x === b));
  if (b.dataset.theme) document.documentElement.dataset.theme = b.dataset.theme;
  else delete document.documentElement.dataset.theme;
  try { localStorage.setItem("cloudshelf-theme", b.dataset.theme); } catch (e) {}
});
try {
  const saved = localStorage.getItem("cloudshelf-theme");
  if (saved) document.querySelector(`#appearance [data-theme="${saved}"]`).click();
} catch (e) {}

function fit() {
  const s = Math.min(1, (window.innerWidth - 32) / 1120);
  $("scaler").style.transform = `scale(${s})`;
  $("scaler").style.height = `${(720 + 28) * s}px`;
}
window.addEventListener("resize", () => { fit(); if (selected === "activity") drawChart(); });
fit();
render();
setInterval(tick, 1000);
</script>
</body>
</html>
